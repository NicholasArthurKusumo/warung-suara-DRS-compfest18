services:
  ml-service:
    build: ./ml-service
    container_name: warung-suara-ml-service
    ports:
      - "8000:8000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: warung-suara-backend
    ports:
      - "3000:3000"
    environment:
      - FASTAPI_URL=http://ml-service:8000
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - backend_db:/app/data
    depends_on:
      - ml-service
    restart: unless-stopped

volumes:
  hf_cache:
  backend_db: